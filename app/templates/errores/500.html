{% extends 'base.html' %}

{% block title %}Error del Servidor - LibroVivo{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        <i class="bi bi-gear-wide-connected" style="font-size: 6rem; color: var(--gris-oscuro);"></i>
        <h1 class="display-1 fw-bold" style="color: var(--gris-oscuro);">500</h1>
        <h2 class="mb-4">Error del Servidor</h2>
        <p class="text-muted mb-4">Ha ocurrido un error interno. Por favor intenta mas tarde.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-librovivo btn-lg">
            <i class="bi bi-house"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
