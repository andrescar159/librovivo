{% extends 'base.html' %}

{% block title %}Cambiar Contrasena - LibroVivo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-librovivo">
            <div class="card-header card-header-librovivo">
                <h4 class="mb-0"><i class="bi bi-key"></i> Cambiar Contrasena</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.cambiar_password') }}">
                    <div class="mb-3">
                        <label class="form-label">Contrasena Actual</label>
                        <input type="password" name="password_actual" class="form-control form-control-librovivo" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Nueva Contrasena</label>
                        <input type="password" name="password_nueva" class="form-control form-control-librovivo" 
                               minlength="8" required>
                        <small class="text-muted">Minimo 8 caracteres</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirmar Nueva Contrasena</label>
                        <input type="password" name="password_confirmar" class="form-control form-control-librovivo" 
                               minlength="8" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-librovivo">
                            <i class="bi bi-check-lg"></i> Cambiar Contrasena
                        </button>
                        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
