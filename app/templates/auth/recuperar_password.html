{% extends 'base.html' %}

{% block title %}Recuperar Contrasena - LibroVivo{% endblock %}

{% block content %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card">
                    <div class="login-header">
                        <i class="bi bi-key" style="font-size: 3rem;"></i>
                        <h2 class="mt-3">Recuperar Contrasena</h2>
                    </div>
                    <div class="login-body">
                        <p class="text-muted mb-4">
                            Ingresa tu correo electronico y te enviaremos una nueva contrasena temporal.
                        </p>
                        
                        <form method="POST" action="{{ url_for('auth.recuperar_password') }}">
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="bi bi-envelope"></i> Correo Electronico
                                </label>
                                <input type="email" name="email" class="form-control form-control-librovivo" 
                                       placeholder="tu@correo.com" required autofocus>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-librovivo">
                                    <i class="bi bi-send"></i> Enviar nueva contrasena
                                </button>
                                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Volver al login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
