{% extends "base.html" %}

{% block title %}Editar Reseña - LibroVivo{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Inicio</a></li>
                    <li class="breadcrumb-item"><a href="{{ url_for('resenas.lista') }}">Reseñas</a></li>
                    <li class="breadcrumb-item active">Editar Reseña #{{ resena.id }}</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Reseña</h4>
                </div>
                <div class="card-body bg-light">
                    <form method="POST" action="{{ url_for('resenas.editar', id=resena.id) }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Calificación actual</label>
                            <div class="d-flex gap-2" id="estrellas">
                                {% for i in range(1, 6) %}
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input d-none" type="radio" name="calificacion" 
                                           id="star{{ i }}" value="{{ i }}" required 
                                           {% if resena.calificacion == i %}checked{% endif %}>
                                    <label class="form-check-label fs-2 text-warning" for="star{{ i }}" 
                                           style="cursor: pointer;" onclick="seleccionarEstrella({{ i }})">
                                        <i class="bi {% if i <= resena.calificacion %}bi-star-fill{% else %}bi-star{% endif %}" 
                                           id="icono-star{{ i }}"></i>
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="comentario" class="form-label fw-bold">Comentario</label>
                            <textarea class="form-control" id="comentario" name="comentario" rows="4" 
                                      maxlength="1000">{{ resena.comentario|default('') }}</textarea>
                            <small class="text-muted">Máximo 1000 caracteres</small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-dark fw-bold">
                                <i class="bi bi-check-lg"></i> Guardar Cambios
                            </button>
                            <a href="{{ url_for('libros.ver', id=resena.libro_id) }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function seleccionarEstrella(n) {
    for (let i = 1; i <= 5; i++) {
        const icono = document.getElementById('icono-star' + i);
        if (i <= n) {
            icono.classList.remove('bi-star');
            icono.classList.add('bi-star-fill');
        } else {
            icono.classList.remove('bi-star-fill');
            icono.classList.add('bi-star');
        }
    }
}
</script>
{% endblock %}
